# OpenOCD configuration for an STM32F103-compatible target using ST-Link/SWD.
#
# The connected target was probed successfully with the original STM32F103
# ARM SW-DP ID below.

source [find interface/stlink.cfg]
transport select swd

set CHIPNAME stm32f103c8
set CPUTAPID 0x1ba01477
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

# This probe is wired with SWDIO, SWCLK, GND, and VTref only. Use a software
# system reset after programming; no NRST signal is available.
reset_config none
adapter speed 100
